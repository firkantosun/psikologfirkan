<!doctype html>
<html lang="tr"><head><meta charset="utf-8">
<style>
:root { --band: #133a3e; --deep: #0b2427; --ink: #eef2ee; --muted: #a9bdb9; --glow: #e4b062; --red: #e8735a; --green: #7fd1a1; }
* { box-sizing: border-box; }
html, body { margin: 0; width: 1280px; height: 720px; overflow: hidden; background: var(--deep); font-family: Inter, sans-serif; color: var(--ink); }
.v { position: absolute; inset: 0; background: radial-gradient(900px 600px at 85% 0%, #1d4d50 0%, transparent 60%), linear-gradient(160deg, var(--band), var(--deep)); }
.serif { font-family: Caladea, "DejaVu Serif", serif; }
.brand { position: absolute; left: 56px; top: 40px; font: 600 15px Inter; letter-spacing: .16em; text-transform: uppercase; color: var(--glow); }
.url { position: absolute; right: 56px; top: 40px; font: 500 15px Inter; color: var(--muted); }
.layer { position: absolute; inset: 0; opacity: 0; }
/* title */
#title { display: grid; place-content: center; text-align: center; gap: 18px; }
#title .em { font-size: 110px; line-height: 1; }
#title h1 { margin: 0; font-size: 76px; font-weight: 400; }
#title p { margin: 0; font-size: 28px; color: var(--muted); }
/* main */
#main .ring { position: absolute; left: 70px; top: 130px; width: 470px; height: 470px; }
.spin { position: absolute; inset: 14%; border-radius: 50%; border: 3px dashed rgba(238,242,238,.25); }
.node { position: absolute; width: 124px; height: 124px; margin: -62px 0 0 -62px; border-radius: 50%; display: grid; place-items: center; align-content: center; gap: 4px; background: rgba(238,242,238,.06); border: 2px solid rgba(238,242,238,.18); }
.node span { font-size: 40px; line-height: 1; filter: grayscale(1); opacity: .5; }
.node b { font-size: 16px; color: var(--muted); }
.node.on { background: rgba(238,242,238,.13); border-color: rgba(238,242,238,.4); }
.node.on span { filter: none; opacity: 1; }
.node.on b { color: var(--ink); }
.node.now { border-color: var(--glow); box-shadow: 0 0 0 10px rgba(228,176,98,.18); }
.node.good { border-color: var(--green); background: rgba(127,209,161,.18); }
.mid { position: absolute; left: 50%; top: 52%; width: 150px; height: 150px; margin: -75px 0 0 -75px; border-radius: 50%; background: var(--glow); color: #132526; display: grid; place-items: center; align-content: center; text-align: center; box-shadow: 0 20px 40px -18px rgba(0,0,0,.7); }
.mid span { font-size: 54px; line-height: 1; }
.mid small { font: 700 15px Inter; margin-top: 6px; }
#main .panel { position: absolute; left: 600px; right: 70px; top: 150px; bottom: 80px; display: grid; align-content: start; gap: 26px; }
.tag { font: 600 17px Inter; letter-spacing: .16em; text-transform: uppercase; color: var(--glow); }
.tag.g { color: var(--green); }
.big { font-size: 96px; line-height: 1; }
.lead { margin: 0; font-size: 34px; line-height: 1.35; }
.small { margin: 0; font-size: 24px; line-height: 1.4; color: var(--muted); }
.bubble { margin: 0; background: #fff; color: #172526; padding: 26px 30px; border-radius: 30px 30px 30px 8px; font-size: 40px; line-height: 1.3; box-shadow: 0 20px 40px -24px rgba(0,0,0,.8); }
.meter { display: grid; grid-template-columns: auto 1fr auto; gap: 18px; align-items: center; }
.meter .lab { font-size: 24px; color: var(--muted); }
.meter .bar { height: 18px; border-radius: 99px; background: rgba(238,242,238,.14); overflow: hidden; }
.meter .bar i { display: block; height: 100%; border-radius: 99px; }
.meter .val { font: 700 30px Inter; min-width: 2.2em; text-align: right; }
.chips { display: flex; flex-wrap: wrap; gap: 14px; }
.chips span { padding: 14px 22px; border-radius: 99px; font-size: 26px; background: rgba(232,115,90,.22); border: 2px solid rgba(232,115,90,.5); }
.step { position: absolute; inset: 0; display: grid; align-content: start; gap: 20px; padding-top: 8px; opacity: 0; }
/* end */
#end { display: grid; place-content: center; text-align: center; gap: 22px; padding: 0 160px; }
#end h2 { margin: 0; font-size: 46px; font-weight: 400; line-height: 1.3; }
#end p { margin: 0; font-size: 26px; color: var(--muted); }
#end .cta { justify-self: center; margin-top: 10px; background: var(--glow); color: #132526; font: 700 28px Inter; padding: 18px 34px; border-radius: 12px; }
.caption { position: absolute; left: 0; right: 0; bottom: 34px; text-align: center; font-size: 16px; color: rgba(238,242,238,.45); }
</style></head>
<body>
<div class="v">
  <div class="brand">Ψ Psikolog Firkan</div><div class="url">psikologfirkan.com</div>
  <div class="layer" id="title"><div class="em" id="tEm"></div><h1 class="serif" id="tH"></h1><p id="tP"></p></div>
  <div class="layer" id="main">
    <div class="ring"><div class="spin" id="spin"></div><div id="nodes"></div><div class="mid"><span id="midE"></span><small id="midT"></small></div></div>
    <div class="panel">
      <div class="meter" id="meter"><span class="lab" id="mLab"></span><div class="bar"><i id="mFill"></i></div><b class="val" id="mVal"></b></div>
      <div style="position:relative;height:400px" id="steps"></div>
    </div>
  </div>
  <div class="layer" id="end"><div class="em" style="font-size:80px">🌱</div><h2 class="serif" id="eH"></h2><p>Bunu görüşmelerde adım adım, birlikte çalışırız.</p><div class="cta">Randevu · psikologfirkan.com</div></div>
  <div class="caption">Bilgilendirme amaçlıdır; tanı ya da tedavi yerine geçmez.</div>
</div>
<script>
var D = null, ST = [];
var POS = [[50,12],[87,39],[73,83],[27,83],[13,39]];
var NODES = [['📍','Durum'],['💭','Düşünce'],['❤️','Duygu'],['🫀','Beden'],['🏃','Davranış']];
function $(i) { return document.getElementById(i); }
function mk(t, c, x) { var e = document.createElement(t); if (c) e.className = c; if (x != null) e.textContent = x; return e; }
function clamp(v) { return v < 0 ? 0 : v > 1 ? 1 : v; }
function seg(t, a, b) { return clamp((t - a) / (b - a)); }
function ease(x) { return 1 - Math.pow(1 - x, 3); }
function fadeIO(t, a, b, f) { f = f || .5; return Math.min(ease(seg(t, a, a + f)), 1 - ease(seg(t, b - f, b))); }
// timeline
var T = { title: [0, 3.2], s0: [3, 7], s1: [7, 11.2], s2: [11, 14.8], s3: [14.6, 18], s4: [17.8, 21.4], loop: [21.2, 24.6], brk: [24.4, 29.2], end: [29, 33] };
var DUR = 33;
window.setup = function (d) {
  D = d; $('tEm').textContent = d.scene.emoji; $('tH').textContent = d.vtitle; $('tP').textContent = d.vsub;
  $('eH').textContent = d.vend;
  var nodes = $('nodes');
  NODES.forEach(function (n, i) { var e = mk('div', 'node'); e.style.left = POS[i][0] + '%'; e.style.top = POS[i][1] + '%'; e.appendChild(mk('span', null, n[0])); e.appendChild(mk('b', null, n[1])); nodes.appendChild(e); });
  var st = $('steps'); var good = d.choices.filter(function (c) { return c.type === 'dengeli'; })[0]; D.good = good;
  var s0 = mk('div', 'step'); s0.appendChild(mk('div', 'tag', '1 · Durum')); s0.appendChild(mk('div', 'big', d.scene.emoji)); s0.appendChild(mk('p', 'lead', d.scene.text));
  var s1 = mk('div', 'step'); s1.appendChild(mk('div', 'tag', '2 · Otomatik düşünce')); var bub = mk('p', 'bubble serif'); s1.appendChild(bub); s1.appendChild(mk('p', 'small', 'O kadar hızlı gelir ki çoğu zaman fark etmeyiz.'));
  var s2 = mk('div', 'step'); s2.appendChild(mk('div', 'tag', '3 · Duygu')); s2.appendChild(mk('div', 'big', d.emotion.emoji)); s2.appendChild(mk('p', 'lead', d.emotion.name + ' yükseliyor…'));
  var s3 = mk('div', 'step'); s3.appendChild(mk('div', 'tag', '4 · Beden')); var ch = mk('div', 'chips'); d.body.forEach(function (b) { ch.appendChild(mk('span', null, b)); }); s3.appendChild(ch);
  var s4 = mk('div', 'step'); s4.appendChild(mk('div', 'tag', '5 · Davranış')); s4.appendChild(mk('p', 'lead', d.behavior)); s4.appendChild(mk('p', 'small', 'Kısa vadede: ' + d.short));
  var sl = mk('div', 'step'); sl.appendChild(mk('div', 'tag', '🔁 Döngü')); sl.appendChild(mk('p', 'lead', d.long));
  var sb = mk('div', 'step'); sb.appendChild(mk('div', 'tag g', '✋ Döngüyü kır')); sb.appendChild(mk('p', 'bubble serif', good.label)); sb.appendChild(mk('p', 'small', good.feedback));
  ST = [s0, s1, s2, s3, s4, sl, sb]; ST.forEach(function (s) { st.appendChild(s); }); D.bub = bub;
};
window.seek = function (t) {
  var d = D;
  $('title').style.opacity = fadeIO(t, T.title[0] - 1, T.title[1]);
  $('title').style.transform = 'scale(' + (1 + .04 * seg(t, 0, 3.2)) + ')';
  var mainO = fadeIO(t, T.s0[0], T.brk[1]); $('main').style.opacity = mainO;
  $('end').style.opacity = fadeIO(t, T.end[0], DUR + 5);
  var keys = ['s0', 's1', 's2', 's3', 's4', 'loop', 'brk'];
  keys.forEach(function (k, i) {
    var o = fadeIO(t, T[k][0], T[k][1], .4); ST[i].style.opacity = o; ST[i].style.transform = 'translateY(' + (1 - ease(seg(t, T[k][0], T[k][0] + .5))) * 24 + 'px)';
  });
  // typewriter
  var n = Math.round(d.thought.length * clamp(seg(t, 7.3, 9.6))); D.bub.textContent = d.thought.slice(0, n) || ' ';
  // chips
  Array.prototype.forEach.call(ST[3].querySelectorAll('.chips span'), function (c, i) { var a = 14.9 + i * .55; c.style.opacity = ease(seg(t, a, a + .35)); c.style.transform = 'scale(' + (.8 + .2 * ease(seg(t, a, a + .35))) + ')'; });
  // nodes
  var cur = -1; ['s0', 's1', 's2', 's3', 's4'].forEach(function (k, i) { if (t >= T[k][0] + .1) cur = i; });
  var good = t >= T.brk[0] + 1.2;
  Array.prototype.forEach.call($('nodes').children, function (e, i) { e.className = 'node' + (i <= cur ? ' on' : '') + (i === cur && t < T.loop[0] ? ' now' : '') + (good ? ' good' : ''); });
  var mids = [['📍', 'Durum'], ['💭', 'Düşünce'], ['❤️', 'Duygu'], ['🫀', 'Beden'], ['🏃', 'Davranış']];
  var m = t >= T.brk[0] + 1.2 ? ['🌱', 'Döngü kırıldı'] : t >= T.brk[0] ? ['✋', 'Senin seçimin'] : t >= T.loop[0] ? ['🔁', 'Döngü'] : cur >= 0 ? mids[cur] : [d.scene.emoji, ''];
  $('midE').textContent = m[0]; $('midT').textContent = m[1];
  var sp = $('spin'); var rot = t >= T.loop[0] && t < T.brk[0] + 1.2 ? (t - T.loop[0]) * 110 : 0;
  sp.style.transform = 'rotate(' + rot + 'deg)';
  sp.style.borderColor = good ? 'rgba(127,209,161,.7)' : rot ? 'rgba(232,115,90,.75)' : 'rgba(238,242,238,.25)';
  sp.style.borderStyle = good ? 'solid' : 'dashed';
  // meter
  var lv = 0; if (t >= T.s2[0]) lv = d.emotion.level * ease(seg(t, 11.4, 13)); if (t >= T.brk[0] + 1.2) lv = d.emotion.level + (d.good.level - d.emotion.level) * ease(seg(t, T.brk[0] + 1.2, T.brk[0] + 2.6));
  $('meter').style.opacity = t >= T.s2[0] ? 1 : 0; $('mLab').textContent = d.emotion.name; $('mVal').textContent = Math.round(lv);
  var h = Math.round(120 - lv * 1.2); $('mFill').style.width = lv + '%'; $('mFill').style.background = 'hsl(' + h + ',62%,55%)';
};
window.DUR = DUR;
</script>
</body></html>
